<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wholesale Khata App</title>
<link href="fonts/fonts.css" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Khata">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<script src="firebase-config.js"></script>
<script src="vendor/qrcode.js"></script>
<style>
:root{--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
/* VOICE everyday shop tool, premium and calm
   IDEA the classic red-cloth bahi-khata with gold edging, made as a modern phone app
   PICTURE the app itself; a deep hero card on home with today's money and a 7-day bar strip
   COLOUR maroon + gold for daily book, navy + gold for GST book, warm ivory page, green in / red due
   TYPE Playfair Display for names and money, Hind for everything else (Hindi ready)
   LAYOUT one phone column; floating bottom bar with gold-ringed plus */
:root{color-scheme:light dark;--bg:light-dark(#fbf8f3,#121110);--page:light-dark(#e8e1d6,#070707);--ink:light-dark(#1f1a17,#f3eee8);--mute:light-dark(#6f665e,#a9a198);--line:light-dark(#ece4d8,#2a2724);--card:light-dark(#ffffff,#1b1a18);--soft:light-dark(#f4eee5,#24221f);--gold:#c9a24a;--gold2:light-dark(#9b7a2c,#e3c27a);--daily:#7d1d2c;--daily2:#4f0f1b;--gst:#173a6b;--gst2:#0c2140;--book:var(--daily);--book2:var(--daily2);--in:light-dark(#147a43,#55c788);--out:light-dark(#b3261e,#ff8075);--warn:light-dark(#8a5a00,#f0bd5a);--warnbg:light-dark(#fbf1dc,#33270f);--sh:0 1px 2px rgba(60,30,10,.06),0 10px 28px -14px rgba(60,30,10,.28);--serif:"Playfair Display",Georgia,serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font:16px/1.45 Hind,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:480px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
#app.gst{--book:var(--gst);--book2:var(--gst2)}
header.top{background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--book) 70%,#fff 12%) 0%,var(--book) 45%,var(--book2) 100%);color:#fff;padding:calc(12px + var(--sat)) 16px 14px;flex:none;position:relative;border-bottom:3px solid var(--gold)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:1px;background:var(--gold);opacity:.55}
.toprow{display:flex;align-items:center;gap:8px}
.toprow h1{font-family:var(--serif);font-size:21px;margin:0;font-weight:700;flex:1;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.toprow .sub{font-size:13px;opacity:.8;font-weight:400;font-family:Hind,sans-serif;letter-spacing:0}
.ib{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;min-width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:15px;padding:0 10px;display:grid;place-items:center}
.ib:active{background:rgba(255,255,255,.28)}
.booksw{display:grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:4px;margin-top:12px}
.booksw button{border:0;background:none;color:#fff;height:40px;border-radius:10px;font-weight:600;font-size:16px;cursor:pointer;opacity:.78;transition:background .2s,color .2s}
.booksw button.on{background:linear-gradient(180deg,#fff,#f6efe2);color:var(--book);opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.25)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 14px 112px;-webkit-overflow-scrolling:touch}
nav.bot{position:absolute;left:10px;right:10px;bottom:calc(10px + var(--sab));height:68px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;box-shadow:0 10px 30px -10px rgba(40,20,10,.35)}
nav.bot button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;color:var(--mute);cursor:pointer;height:64px;justify-content:center;font-weight:500}
nav.bot button.on{color:var(--book)}
nav.bot button.on svg{stroke-width:2.4}
:root[data-theme=dark] nav.bot button.on,#app nav.bot button.on{color:light-dark(var(--book),var(--gold))}
nav.bot svg{width:24px;height:24px}
nav.bot .plus{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--book) 75%,#fff 25%),var(--book) 55%,var(--book2));color:#fff;margin:-34px auto 0;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--gold),0 10px 22px rgba(0,0,0,.3);font-size:32px;line-height:1}
h2{font-family:var(--serif);font-size:22px;margin:6px 0 10px;font-weight:700;line-height:1.2}
h3{font-size:13px;margin:20px 2px 8px;font-weight:600;color:var(--gold2);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mute{color:var(--mute)}.small{font-size:14px}
.in{color:var(--in)}.out{color:var(--out)}
.num{font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.big{font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.1;font-variant-numeric:lining-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.stat .l{font-size:13.5px;color:var(--mute)}
.hero{border-radius:22px;padding:16px;margin-bottom:12px;color:#fff;background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--book) 65%,#fff 15%),var(--book) 50%,var(--book2));box-shadow:0 14px 30px -14px color-mix(in srgb,var(--book) 70%,#000);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:8px;border:1px solid rgba(201,162,74,.45);border-radius:16px;pointer-events:none}
.hero .g{color:#f1d892;font-size:13.5px}
.hero .amt{font-family:var(--serif);font-size:36px;font-weight:700;line-height:1.05;margin:4px 0 2px}
.hero .pr{display:inline-block;background:rgba(255,255,255,.14);border-radius:99px;padding:2px 10px;font-size:14px;margin-top:4px}
.spark{display:flex;align-items:flex-end;gap:6px;height:54px;margin-top:12px;position:relative;z-index:1}
.spark div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.spark i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:rgba(255,255,255,.35)}
.spark i.t{background:#f1d892}
.spark span{font-size:11px;opacity:.8}
.hero .note{font-size:14px;margin-top:10px;opacity:.92;position:relative;z-index:1}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;cursor:pointer;font-weight:500;box-shadow:var(--sh)}
.qa button:active{transform:scale(.97)}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.ic svg{width:24px;height:24px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:0 14px;height:54px;margin-bottom:12px;box-shadow:var(--sh)}
.search input{border:0;background:none;outline:0;flex:1;font-size:17px;height:100%}
.search:focus-within{border-color:var(--gold)}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .t{font-weight:600;line-height:1.25}
.li .s{font-size:14px;color:var(--mute)}
.av{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-weight:700;color:var(--book);flex:none;font-family:var(--serif);font-size:19px}
.av svg{width:22px;height:22px}
.chev{color:var(--gold2);font-size:22px}
.pill{display:inline-block;font-size:12.5px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--mute);font-weight:500;white-space:nowrap}
.pill.red{background:color-mix(in srgb,var(--out) 13%,transparent);color:var(--out)}
.pill.green{background:color-mix(in srgb,var(--in) 13%,transparent);color:var(--in)}
.pill.amber{background:var(--warnbg);color:var(--warn)}
.pill.blue{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2)}
.alert{background:var(--card);border:1px solid var(--line);border-left:0;color:var(--ink);border-radius:0 16px 16px 0;padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer;box-shadow:var(--sh);position:relative}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.alert{border-radius:16px;padding-left:16px;overflow:hidden}
.alert b{font-weight:600;color:var(--warn);white-space:nowrap;flex:none}
.btn{border:0;background:linear-gradient(180deg,color-mix(in srgb,var(--book) 88%,#fff),var(--book));color:#fff;height:52px;border-radius:16px;font-weight:600;font-size:17px;padding:0 18px;cursor:pointer;width:100%;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--book) 80%,#000)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh)}
.btn.green{background:linear-gradient(180deg,#22975a,#147a43);box-shadow:0 6px 16px -8px #0b5a2f}
.btn.danger{background:linear-gradient(180deg,#d2413a,#b3261e);box-shadow:none}
.btn.gold{background:linear-gradient(180deg,#e0bd6a,#b88f35);color:#2b1d05}
.btn.sm{height:40px;font-size:15px;width:auto;border-radius:12px;padding:0 14px}
.btn:disabled{opacity:.45}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;height:40px;border-radius:10px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap;padding:0 10px}
.seg button.on{background:var(--card);color:light-dark(var(--book),var(--gold));box-shadow:0 2px 6px rgba(0,0,0,.1);outline:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:14px;color:var(--mute);margin-bottom:4px;font-weight:500}
.inp{width:100%;height:52px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:var(--card);font-size:17px;outline:0}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
textarea.inp{height:90px;padding:10px 14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.back{border:0;background:none;color:light-dark(var(--book),var(--gold));font-weight:600;font-size:16px;padding:4px 0;margin-bottom:4px;cursor:pointer}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;font-size:13px;color:var(--mute);font-weight:500;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px dashed var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right}
.scroll{overflow-x:auto}
.sheetbg{position:absolute;inset:0;background:rgba(20,10,5,.5);backdrop-filter:blur(2px);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:8px 16px calc(24px + var(--sab));animation:up .22s ease-out;border-top:3px solid var(--gold)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.toast{position:absolute;left:20px;right:20px;bottom:calc(92px + var(--sab));background:#1f1a17;color:#fff;padding:12px 14px;border-radius:14px;z-index:40;font-size:15px;text-align:center;border:1px solid var(--gold);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.addgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.addgrid button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:14.5px;cursor:pointer;box-shadow:var(--sh)}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;height:52px;background:var(--card)}
.qty button{width:48px;height:100%;border:0;background:var(--soft);font-size:22px;cursor:pointer;color:light-dark(var(--book),var(--gold))}
.qty input{border:0;width:100%;text-align:center;font-size:18px;font-weight:600;outline:0;background:var(--card);height:100%}
.warnbox{background:color-mix(in srgb,var(--out) 10%,transparent);color:var(--out);border-radius:12px;padding:8px 10px;font-size:14px;margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.cal .h{font-size:12px;color:var(--mute)}
.cal .d{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:600;background:var(--soft);cursor:pointer;border:0}
.cal .P{background:color-mix(in srgb,var(--in) 20%,transparent);color:var(--in)}
.cal .A{background:color-mix(in srgb,var(--out) 18%,transparent);color:var(--out)}
.cal .H{background:var(--warnbg);color:var(--warn)}
.cal .L{background:color-mix(in srgb,#3b6fc4 18%,transparent);color:light-dark(#2a56a0,#8fb0f0)}
.cal .S{opacity:.35}
.att{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.att button{height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.att button.onP{background:var(--in);color:#fff;border-color:var(--in)}
.att button.onA{background:var(--out);color:#fff;border-color:var(--out)}
.att button.onH{background:#c48a12;color:#fff;border-color:#c48a12}
.att button.onL{background:#3b6fc4;color:#fff;border-color:#3b6fc4}
.bars .br{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.bars .tr{height:14px;background:var(--soft);border-radius:99px;overflow:hidden}
.bars .fl{height:100%;background:linear-gradient(90deg,var(--gold),var(--book));border-radius:99px}
.bars .fl.neg{background:var(--out)}
.bars .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart{display:flex;align-items:flex-end;gap:5px;height:160px;padding-top:20px;border-bottom:1px solid var(--line);margin-top:6px}
.chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.chart .c i{display:block;width:100%;background:linear-gradient(180deg,var(--gold),var(--book));border-radius:6px 6px 2px 2px;min-height:2px}
.chart .c i.neg{background:var(--out)}
.xl{display:flex;gap:5px;font-size:11px;color:var(--mute);margin-top:4px}
.xl span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
.bill{background:#fffdf8;color:#1d1a17;border:1px solid #e4d7bd;border-radius:10px;padding:18px 16px;font-size:13px;position:relative;box-shadow:var(--sh)}
.bill::before{content:"";position:absolute;inset:6px;border:1px solid #e9dcc0;border-radius:6px;pointer-events:none}
.bill h4{margin:0;font-family:var(--serif);font-size:21px;text-align:center;color:#5a1420}
.bill .c{text-align:center}
.bill .ttl{text-align:center;font-weight:700;letter-spacing:.14em;font-size:12px;color:#8a6a1f;margin:10px 0 8px;border-top:1px solid #d9c595;border-bottom:1px solid #d9c595;padding:4px 0}
.bill table{width:100%;border-collapse:collapse;margin-top:8px}
.bill th{background:#f6efdf;font-weight:600}
.bill th,.bill td{border-bottom:1px solid #ece2cc;padding:5px 4px;text-align:left}
.bill .r{text-align:right;white-space:nowrap}
.bill .tot td{font-weight:700;border-top:2px double #8a6a1f;font-size:15px}
.lockscr{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--book) 70%,#fff 15%),var(--book) 45%,var(--book2));color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab))}
.mono{width:84px;height:84px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:36px;font-weight:700;color:#f1d892;margin-bottom:12px;box-shadow:0 0 0 6px rgba(201,162,74,.15)}
.dots{display:flex;gap:14px;margin:18px 0 26px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid #f1d892}
.dots i.f{background:#f1d892}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;font-size:28px;font-weight:600;cursor:pointer}
.pad button:active{background:rgba(255,255,255,.3)}
.mic{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--book) 75%,#fff 25%),var(--book) 60%,var(--book2));color:#fff;border:0;font-size:15px;font-weight:600;display:grid;place-items:center;margin:10px auto;cursor:pointer;box-shadow:0 0 0 6px var(--bg),0 0 0 8px var(--gold)}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media(prefers-reduced-motion:reduce){.mic.on{animation:none}}
.drop{border:2px dashed var(--gold);border-radius:18px;padding:28px 12px;text-align:center;cursor:pointer;display:block;background:color-mix(in srgb,var(--gold) 7%,transparent)}
.prog{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--book));transition:width .3s}
.tag{font-size:12px;color:var(--mute)}
.lock{font-size:13px;color:var(--mute)}
.sample{font-size:13px;color:var(--mute);text-align:center;margin:18px 0 4px}
@media(min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 60px rgba(60,30,10,.15)}}
@media print{body{overflow:visible;background:#fff}#app{height:auto;max-width:none;border:0}header.top,nav.bot,.noprint{display:none!important}main{overflow:visible;padding:0}.sheetbg{position:static;background:none}.sheet{max-height:none;padding:0}}

/* MINIMAL – flat, quiet surfaces; colour is used only to carry meaning.
   Book colour (header, main button): maroon = Daily book, navy = GST book.
   Green = money in / paid / in stock · Red = money out / due / loss / out of stock · Amber = waiting / needs attention · Blue = people & information */
:root{--bg:light-dark(#f6f6f4,#111111);--page:light-dark(#e9e9e6,#060606);--card:light-dark(#ffffff,#1a1a1a);--line:light-dark(#e4e4e0,#2c2c2c);--soft:light-dark(#f1f1ee,#242424);
 --ink:light-dark(#161616,#f2f2f2);--mute:light-dark(#5f5f5a,#a5a5a0);--daily:#8a1c2b;--daily2:#8a1c2b;--gst:#1d3f73;--gst2:#1d3f73;
 --in:light-dark(#157a46,#4fc583);--out:light-dark(#c0362c,#ff7a6e);--warn:light-dark(#9a6200,#f0b44c);--warnbg:light-dark(#fdf3df,#33270f);--info:light-dark(#2559a6,#82b1ff);
 --gold:light-dark(#d9d9d4,#3a3a3a);--gold2:var(--mute);--sh:none}

const cOf=id=>contacts.find(c=>c.id===id)||{name:'Unknown',phone:''};
function billTotal(x,bk){
  bk=bk||S.book;let sub=0,tax=0;const igst=bk==='gst'&&cOf(x.cid).gstin&&cOf(x.cid).gstin.slice(0,2)!==S.shop.state;
  x.items.forEach(i=>{const a=i.qty*i.rate;sub+=a;if(bk==='gst')tax+=a*prodOf(i.vid).gst/100});
  return {sub,tax,igst,grand:Math.round(sub+tax)};
}
function stockOf(vid,bk){
  const b=S.books[bk||S.book];let q=b.open[vid]||0;
  b.bills.forEach(x=>{if(!live(x))return;x.items.forEach(i=>{if(i.vid===vid)q+=x.type==='purchase'?pcs(i):-pcs(i)})});
  (b.cns||[]).forEach(cn=>cn.items.forEach(i=>{if(i.vid===vid)q+=pcs(i)}));
  return q;
}
const fq=(q,vid)=>{const p=VAR[vid].ppc;const c=Math.floor(Math.abs(q)/p),r=Math.abs(q)%p;const sg=q<0?'-':'';return sg+(c?c+' '+(S.lang==='hi'?'पेटी':'ctn'):'')+(c&&r?' + ':'')+(r||!c?r+' '+(S.lang==='hi'?'पीस':'pcs'):'')};
function avgCost(vid,bk){let q=0,v=0;S.books[bk||S.book].bills.forEach(x=>{if(x.type!=='purchase'||!live(x))return;x.items.forEach(i=>{if(i.vid===vid){q+=pcs(i);v+=i.qty*i.rate}})});return q?v/q:VAR[vid].mrp*.78}
function lastBuy(vid){const b=B().bills.filter(x=>x.type==='purchase'&&live(x));for(let k=b.length-1;k>=0;k--){const i=b[k].items.find(i=>i.vid===vid);if(i)return perPc(i)}return avgCost(vid)}
function balance(cid,bk){
  const b=S.books[bk||S.book];const c=cOf(cid);let bal=b.cOpen[cid]||0;
  b.bills.forEach(x=>{if(x.cid===cid&&live(x))bal+=billTotal(x,bk).grand});
  (b.cns||[]).forEach(cn=>{if(cn.cid===cid)bal-=cn.amt});
  b.pays.forEach(p=>{if(p.cid===cid&&!(p.chq&&p.chq.st==='bounced'))bal-=p.amt});
  return bal; // party: + means he must get; vendor: + means he must give
}
function ageing(cid){
  const b=B();let paid=b.pays.filter(p=>p.cid===cid&&!(p.chq&&p.chq.st==='bounced')).reduce((a,p)=>a+p.amt,0)+(b.cns||[]).filter(c=>c.cid===cid).reduce((a,c)=>a+c.amt,0);
  const bk=[0,0,0,0];let oldest=null;
  const op=b.cOpen[cid]||0;if(op>0){if(paid>=op)paid-=op;else{bk[3]+=op-paid;paid=0;oldest=today0-91*DAY}}
  b.bills.filter(x=>x.cid===cid&&live(x)).forEach(x=>{const g=billTotal(x).grand;let due=g;if(paid>=g){paid-=g;due=0}else{due=g-paid;paid=0}
    if(due>0){const a=(today0-x.date)/DAY;bk[a<30?0:a<60?1:a<90?2:3]+=due;if(oldest===null)oldest=x.date}});
  return {bk,oldest};
}
function profitOf(x){if(x.type!=='sale'||!live(x))return 0;let p=0;x.items.forEach(i=>p+=pcs(i)*(perPc(i)-avgCost(i.vid)));return p}
function lastSaleDate(vid){const b=B().bills;for(let k=b.length-1;k>=0;k--){if(b[k].type==='sale'&&live(b[k])&&b[k].items.some(i=>i.vid===vid))return b[k].date}return null}
function rateRows(vid,type){const r=[];B().bills.forEach(x=>{if(x.type!==type||x.status==='cancelled')return;x.items.forEach(i=>{if(i.vid===vid)r.push({x,i})})});return r.sort((a,b)=>b.x.date-a.x.date)}
function lastRateFor(vid,cid,type,unit){const r=rateRows(vid,type).filter(o=>o.x.cid===cid);const u=r.find(o=>o.i.unit===unit);if(u)return u.i.rate;if(r[0]){const p=perPc(r[0].i);return unit==='ctn'?Math.round(p*VAR[vid].ppc):Math.round(p*2)/2}return null}
function defRate(vid,type,unit,rt){const V=VAR[vid];const p=type==='purchase'?lastBuy(vid):V.mrp*(rt==='retail'?.95:.86);return unit==='ctn'?Math.round(p*V.ppc):Math.round(p*2)/2}

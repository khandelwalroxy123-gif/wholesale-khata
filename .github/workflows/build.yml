name: Build Android, iPhone and website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    name: Android (APK + Play Store AAB)
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Assemble app file from parts
        run: |
          cat www/parts/*.html > www/index.html
          ls -l www/index.html

      - name: Install Capacitor and plugins
        run: npm ci

      - name: Create Android project (Capacitor 8, target SDK 36)
        run: npx cap add android

      - name: App icon and splash screen
        run: npx capacitor-assets generate --android

      - name: Manifest – microphone for voice entry, no cloud auto-backup, no exact alarms
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application#' "$M"
          sed -i 's#<application#<queries>\n        <intent><action android:name="android.speech.RecognitionService" /></intent>\n        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>\n    </queries>\n    <application#' "$M"
          sed -i 's#android:allowBackup="true"#android:allowBackup="false"#' "$M"
          # notifications are shown at once; the plugin's exact-alarm permission is not needed (Play restricts it)
          grep -q 'xmlns:tools' "$M" || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android"#<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"#' "$M"
          sed -i 's#<application#<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" tools:node="remove" />\n    <application#' "$M"
          cat "$M"

      - name: Version number (must go up for every Play upload)
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" "$G"
          grep -nE "versionCode|versionName|targetSdk|compileSdk" "$G" android/variables.gradle || true

      - name: Copy app into Android project
        run: npx cap sync android

      - name: Signing key for Google Play (from repository secrets)
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('upload.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ "$HAS_KEY" = "true" ]; then
            ./gradlew bundleRelease assembleRelease --no-daemon
            cp app/build/outputs/bundle/release/app-release.aab ../WholesaleKhata-PlayStore.aab
            cp app/build/outputs/apk/release/app-release.apk ../WholesaleKhata.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../WholesaleKhata.apk
            echo "::warning::No signing key in repository secrets, so no Play Store AAB was made. See PLAY_STORE.md."
          fi

      - name: Show final permissions
        run: |
          f=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' | head -1)
          echo "$f"; grep -oE 'uses-permission[^>]*' "$f" || true
          grep -oE 'android:targetSdkVersion="[0-9]+"' "$f" || true

      - uses: actions/upload-artifact@v4
        with:
          name: WholesaleKhata-android
          path: |
            WholesaleKhata.apk
            WholesaleKhata-PlayStore.aab
          if-no-files-found: warn

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Wholesale Khata v${{ env.VERSION_NAME }}
          body: |
            Download **WholesaleKhata.apk** below and open it on your Android phone.
            Allow "Install unknown apps" for your browser or file manager when asked.
            ${{ env.HAS_KEY == 'true' && 'WholesaleKhata-PlayStore.aab is the file to upload in Google Play Console.' || '' }}
          files: |
            WholesaleKhata.apk
            WholesaleKhata-PlayStore.aab
          fail_on_unmatched_files: false

  ios:
    name: iPhone (iOS)
    needs: android
    runs-on: macos-15
    continue-on-error: true
    env:
      HAS_APPLE: ${{ secrets.ASC_KEY_P8_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
      VERSION_NAME: 1.1.${{ github.run_number }}
      BUILD_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Newest Xcode on this runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "Using $X"
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version

      - name: Assemble app file from parts
        run: cat www/parts/*.html > www/index.html

      - name: Install Capacitor and plugins
        run: npm ci

      - name: Create iOS project (CocoaPods – the voice plugin has no Swift package yet)
        run: npx cap add ios --packagemanager CocoaPods

      - name: App icon and splash screen
        run: npx capacitor-assets generate --ios

      - name: Info.plist – why the app asks for microphone, speech and Face ID
        run: |
          P=ios/App/App/Info.plist; B=/usr/libexec/PlistBuddy
          $B -c "Add :NSMicrophoneUsageDescription string 'The microphone is used only when you tap Speak, to fill a bill or entry by voice.'" "$P"
          $B -c "Add :NSSpeechRecognitionUsageDescription string 'Your spoken words are turned into text to fill the entry. No recording is kept.'" "$P"
          $B -c "Add :NSFaceIDUsageDescription string 'Face ID or Touch ID opens Wholesale Khata instead of typing your PIN.'" "$P"
          $B -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P"
          $B -c "Set :CFBundleDisplayName 'Wholesale Khata'" "$P" || $B -c "Add :CFBundleDisplayName string 'Wholesale Khata'" "$P"
          plutil -p "$P"

      - name: Copy app into iOS project
        run: npx cap sync ios

      - name: Build for iPhone Simulator (proves the iOS app compiles; no Apple account needed)
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NO" build | tail -40
          cd build/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/WholesaleKhata-iOS-Simulator.zip" App.app
          ls -l "$GITHUB_WORKSPACE/WholesaleKhata-iOS-Simulator.zip"

      - name: Signed build and upload to TestFlight (only when Apple secrets are set – see IOS.md)
        if: env.HAS_APPLE == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -o pipefail
          K="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; echo "$ASC_KEY_P8_BASE64" | base64 -d > "$K"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $K -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NO" $AUTH archive | tail -40
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          sed -i '' 's/^          //' "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out" $AUTH | tail -40
          echo "Uploaded build $BUILD_NO ($VERSION_NAME) to App Store Connect → TestFlight."

      - name: No Apple account yet
        if: env.HAS_APPLE != 'true'
        run: echo "::warning::iOS app built for the Simulator only. To install on iPhones / TestFlight / App Store, add the Apple secrets described in IOS.md."

      - uses: actions/upload-artifact@v4
        with:
          name: WholesaleKhata-ios
          path: WholesaleKhata-iOS-Simulator.zip

      - name: Add to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          files: WholesaleKhata-iOS-Simulator.zip
          fail_on_unmatched_files: false

  website:
    name: Website (GitHub Pages)
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble app file from parts
        run: cat www/parts/*.html > www/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v5
